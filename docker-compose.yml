services:

  postgres:
    image: postgres:17
    container_name: land-registry-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DATABASE:-postgres}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    # docker's default /dev/shm is 64 MB, which parallel queries over the
    # 31M-row tables exhaust ("could not resize shared memory segment ...
    # No space left on device"); takes effect on the next `docker compose up`
    shm_size: 1gb
    volumes:
      # bind mount into the project directory for easy migration and so the
      # data cannot be removed by `docker system/volume prune`
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DATABASE:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # Each dataset is a separate one-shot service under its own profile, so
  # they can be refreshed independently. All of them share the same image.
  # Re-run with `--build` after changing any of the python code.

  # UK Land Registry Price Paid data sync, run with:
  #   docker compose run --rm ingestion
  ingestion:
    build: .
    image: simple-land-registry-data-ingestion
    container_name: land-registry-ingestion
    profiles:
      - ingestion
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-postgres}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs

  # Bank of England interest rates (Bank Rate, quoted and effective mortgage
  # rates from the BoE Interactive Database), run with:
  #   docker compose run --rm boe-ingestion
  boe-ingestion:
    build: .
    image: simple-land-registry-data-ingestion
    container_name: bank-of-england-ingestion
    profiles:
      - boe-ingestion
    command: ["sh", "-c", "python /app/init_db.py && python /app/main_boe_rates.py"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-postgres}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs

  # address / postcode validation of the Price Paid data against the NSPL
  # (needs both the ingestion and ons-ingestion services to have run), run with:
  #   docker compose run --rm pp-validation
  pp-validation:
    build: .
    image: simple-land-registry-data-ingestion
    container_name: land-registry-pp-validation
    profiles:
      - pp-validation
    command: ["sh", "-c", "python /app/init_db.py && python /app/main_pp_validation.py"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-postgres}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs

  # ONS National Statistics Postcode Lookup (postcode -> coordinates, LSOA,
  # local authority, region, rural/urban ...), latest quarterly release, run with:
  #   docker compose run --rm ons-ingestion
  ons-ingestion:
    build: .
    image: simple-land-registry-data-ingestion
    container_name: ons-ingestion
    profiles:
      - ons-ingestion
    command: ["sh", "-c", "python /app/init_db.py && python /app/main_nspl.py"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-postgres}
      # optionally pin a release instead of resolving the latest one
      NSPL_ARCGIS_ITEM_ID: ${NSPL_ARCGIS_ITEM_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
